
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sailauov08
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#161B22,#164E63,#0891B2,#67E8F9,#A78BFA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67E8F9

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
