<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Bekarys Sailauov — Developer Portfolio</title>
<desc id="desc">Minimal dark blue developer banner with cyan and violet highlights.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f20"/><stop offset=".58" stop-color="#111b35"/><stop offset="1" stop-color="#071b29"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70E5FC"/><stop offset=".55" stop-color="#8CA8FF"/><stop offset="1" stop-color="#AF83FC"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#44D8F5" stop-opacity=".65"/><stop offset="1" stop-color="#A37CFA" stop-opacity=".1"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#A0B9DB" stroke-width=".6" opacity=".095"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
